<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UIForge</title>
    <script>
      // GitHub Pages SPA redirect.
      // Encodes the full path into the query string, then redirects to index.html.
      // The script in index.html decodes it and restores the URL before React boots.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
