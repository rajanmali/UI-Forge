<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f3c"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid overlay -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orb top-right -->
  <ellipse cx="1050" cy="120" rx="280" ry="220" fill="rgba(37,99,235,0.18)" filter="url(#glow)"/>

  <!-- Glow orb bottom-left -->
  <ellipse cx="160" cy="520" rx="200" ry="160" fill="rgba(27,58,107,0.25)" filter="url(#glow)"/>

  <!-- Hexagon logo mark -->
  <polygon
    points="120,315 155,254 225,254 260,315 225,376 155,376"
    fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"
  />
  <polygon
    points="120,315 155,254 225,254 260,315 225,376 155,376"
    fill="rgba(37,99,235,0.12)"
  />
  <text x="190" y="323" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#2563EB" text-anchor="middle">⬡</text>

  <!-- Brand name -->
  <text x="300" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-2">UIForge</text>

  <!-- Tagline -->
  <text x="300" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">Agency-level React component library</text>

  <!-- Divider -->
  <rect x="300" y="375" width="56" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Feature pills -->
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="500">
    <!-- pill 1 -->
    <rect x="300" y="400" width="118" height="32" rx="16" fill="rgba(37,99,235,0.18)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="359" y="421" fill="rgba(255,255,255,0.85)" text-anchor="middle">React 18</text>

    <!-- pill 2 -->
    <rect x="432" y="400" width="118" height="32" rx="16" fill="rgba(37,99,235,0.18)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="491" y="421" fill="rgba(255,255,255,0.85)" text-anchor="middle">TypeScript</text>

    <!-- pill 3 -->
    <rect x="564" y="400" width="132" height="32" rx="16" fill="rgba(37,99,235,0.18)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="630" y="421" fill="rgba(255,255,255,0.85)" text-anchor="middle">Design Tokens</text>

    <!-- pill 4 -->
    <rect x="710" y="400" width="118" height="32" rx="16" fill="rgba(37,99,235,0.18)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="769" y="421" fill="rgba(255,255,255,0.85)" text-anchor="middle">Dark Mode</text>

    <!-- pill 5 -->
    <rect x="842" y="400" width="136" height="32" rx="16" fill="rgba(37,99,235,0.18)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="910" y="421" fill="rgba(255,255,255,0.85)" text-anchor="middle">Framer Motion</text>
  </g>

  <!-- Component count badge -->
  <rect x="300" y="455" width="220" height="44" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="320" y="483" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.5)">15 components  ·  5 palettes  ·  v1.0</text>
</svg>
