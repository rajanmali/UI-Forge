name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Skip if this is already a release commit (prevents infinite loop)
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Capture pre-release version
        id: pre
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run standard-version
        run: npm run release

      - name: Check for version bump
        id: bump
        run: |
          NEW=$(node -e "console.log(require('./package.json').version)")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "${{ steps.pre.outputs.version }}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changelog to Changelog.tsx and version.ts
        if: steps.bump.outputs.bumped == 'true'
        run: node scripts/sync-changelog.js

      - name: Commit release and push tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git add package.json package-lock.json CHANGELOG.md src/pages/Changelog/Changelog.tsx src/version.ts
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --follow-tags
